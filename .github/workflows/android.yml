name: Android widget

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Lint and build
        working-directory: android
        run: gradle --no-daemon lintRelease assembleRelease
      - name: Collect APK
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk hoki-widget.apk
          ls -l hoki-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hoki-widget
          path: hoki-widget.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" hoki-widget.apk \
            --title "Hoki phone widget ${VERSION}" \
            --notes "Android home-screen widget: the waving lucky cat, tap it for luck. Install hoki-widget.apk, then long-press the home screen > Widgets > Hoki." \
            --latest
