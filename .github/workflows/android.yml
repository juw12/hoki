name: Android widget

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "index.html"
      - "manifest.webmanifest"
      - "css/**"
      - "js/**"
      - "assets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Decode signing key
        env:
          HOKI_KEYSTORE_B64: ${{ secrets.HOKI_KEYSTORE_B64 }}
        run: |
          if [ -z "$HOKI_KEYSTORE_B64" ]; then
            echo "::error::Repo secret HOKI_KEYSTORE_B64 is missing (see README, Android signing)"
            exit 1
          fi
          echo "$HOKI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hoki-release.p12"
          echo "HOKI_KEYSTORE_FILE=$RUNNER_TEMP/hoki-release.p12" >> "$GITHUB_ENV"
      - name: Lint and build
        working-directory: android
        env:
          HOKI_KEYSTORE_PASSWORD: ${{ secrets.HOKI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon lintRelease assembleRelease
      - name: Collect APK
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk hoki-widget.apk
          ls -l hoki-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hoki-widget
          path: hoki-widget.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" hoki-widget.apk \
            --title "Hoki ${VERSION}: Windows app + Android app" \
            --notes "Android: the full 3D Hoki app (works offline) plus the home-screen widget. Install hoki-widget.apk, then long-press the home screen > Widgets > Hoki. Windows: Hoki.exe is attached by the Windows workflow." \
            --latest
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hoki-release.p12"
