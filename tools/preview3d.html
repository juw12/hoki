<!doctype html>
<html><head><meta charset="utf-8"><title>Hoki 3D preview</title>
<!-- Renders the 3D cat at a fixed pose: ?fold=0..1 (0 = paw raised, 1 = folded toward the viewer).
     ?transparent drops the backdrop (used by tools/make_widget_frames.py); ?w=&h= set the stage size. -->
<style>html,body{margin:0;background:#f6f2eb}body.transparent,html.transparent{background:transparent}#stage{width:480px;height:528px}#stage canvas{display:block;width:100%;height:100%}</style></head>
<body><div id="stage"></div>
<script type="module">
import { createCat3D } from '../js/cat3d.js';
const params = new URLSearchParams(location.search);
const stage = document.getElementById('stage');
if (params.has('transparent')) {
  document.documentElement.classList.add('transparent');
  document.body.classList.add('transparent');
}
if (params.has('w')) {
  stage.style.width = params.get('w') + 'px';
}
if (params.has('h')) {
  stage.style.height = params.get('h') + 'px';
}
const cat = createCat3D(stage, { sway: false });
cat.update(Number(params.get('fold') || 0), 0);
window.cat = cat;
window.setFold = (fold) => {
  cat.update(fold, 0);
  return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
};
window.ready = true;
</script></body></html>
