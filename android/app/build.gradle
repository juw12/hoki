plugins {
    id "com.android.application"
}

def hokiKeystoreProps = new Properties()
def hokiKeystorePropsFile = rootProject.file("keystore.properties")
if (hokiKeystorePropsFile.exists()) {
    hokiKeystorePropsFile.withInputStream { hokiKeystoreProps.load(it) }
}
def hokiSigning = { String name -> System.getenv(name) ?: hokiKeystoreProps.getProperty(name) }
def hokiKeystoreFile = hokiSigning("HOKI_KEYSTORE_FILE")

android {
    namespace "io.github.juw12.hoki"
    compileSdk 34

    defaultConfig {
        applicationId "io.github.juw12.hoki"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "3.2.0"
    }

    // Private release key, never committed. Values come from env vars (CI secrets) or the
    // git-ignored android/keystore.properties written by tools/android_setup.py.
    // Without them, debug builds use the default debug key and release stays unsigned.
    signingConfigs {
        if (hokiKeystoreFile) {
            hoki {
                storeFile file(hokiKeystoreFile)
                storeType "pkcs12"
                storePassword hokiSigning("HOKI_KEYSTORE_PASSWORD")
                keyAlias hokiSigning("HOKI_KEY_ALIAS") ?: "hoki"
                keyPassword hokiSigning("HOKI_KEY_PASSWORD") ?: hokiSigning("HOKI_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hokiKeystoreFile) {
                signingConfig signingConfigs.hoki
            }
        }
        debug {
            if (hokiKeystoreFile) {
                signingConfig signingConfigs.hoki
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The full web app (repo root) is bundled into the APK so the app works offline.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/hokiweb"]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable "IconMissingDensityFolder", "IconLocation", "OldTargetApi", "GradleDependency", "AndroidGradlePluginVersion"
    }
}

def webRoot = rootProject.file("..")

tasks.register("copyHokiWeb", Copy) {
    from(webRoot) {
        include "index.html", "manifest.webmanifest"
        include "css/**", "js/**", "assets/**"
    }
    into "$buildDir/generated/hokiweb/www"
}

preBuild.dependsOn("copyHokiWeb")
